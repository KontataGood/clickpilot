name: Test and Build ClickPilot

"on":
  push:
    branches:
      - main
      - feature/ui-improvements
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m pytest -v

  build:
    name: Build Windows application
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean clickpilot.spec

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ClickPilot-Windows
          path: dist/
          if-no-files-found: error
          retention-days: 14
